name: docker

on:
  push:
    tags:
      - 'v*'

jobs:
  docker-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: mmhk/ddddocr
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test image
        run: |
          docker pull mmhk/ddddocr:${{ steps.meta.outputs.version }}
          docker run --rm mmhk/ddddocr:${{ steps.meta.outputs.version }} --help
          docker run -d --name ddddocr-smoke -p 8000:8000 mmhk/ddddocr:${{ steps.meta.outputs.version }}
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/status; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/status
          docker rm -f ddddocr-smoke
